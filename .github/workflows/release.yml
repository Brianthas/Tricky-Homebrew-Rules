name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Zip module
        run: |
          zip -r module.zip module.json scripts lang styles LICENSE README.md CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
