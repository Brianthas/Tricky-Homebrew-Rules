name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: for f in $(find scripts test tools -name '*.mjs'); do node --check "$f"; done

      # Lint runs in CI rather than only on demand: `npm run lint` passing locally depends on
      # someone remembering to run it. eslint 10 handed a directory reads every file the flat
      # config does not ignore, currently 23, and the run fails on any error.
      - name: Lint
        run: npm run lint

      - name: Validate module.json
        run: node -e "JSON.parse(require('fs').readFileSync('module.json','utf8')); console.log('module.json OK')"

      - name: Validate lang/en.json
        run: node -e "JSON.parse(require('fs').readFileSync('lang/en.json','utf8')); console.log('lang/en.json OK')"

      - name: Check localisation keys
        run: node tools/check-lang.mjs

      - name: Run tests
        run: node --test test/*.test.mjs
